<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Topoya Racing</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #050505; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: space-between;
            height: 100vh;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #game-container { 
            width: 100%; max-width: 400px; 
            flex-grow: 1; display: flex; align-items: center; 
        }

        canvas { 
            background: #111; border: 2px solid #333; 
            border-radius: 8px; width: 100%; height: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        #hud-bottom {
            width: 100%; max-width: 400px; background: #000; color: white;
            display: flex; justify-content: space-around; 
            padding: 15px 0; border-top: 3px solid #e74c3c;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 22px; font-weight: bold; color: #fff; font-family: 'Courier New', monospace; }

        #controls {
            width: 100%; max-width: 400px; 
            display: flex; justify-content: space-between;
            padding: 20px 30px; box-sizing: border-box; 
            background: #000; padding-bottom: 30px;
        }
        .btn {
            width: 85px; height: 85px; 
            background: linear-gradient(145deg, #222, #111);
            border: 2px solid #444;
            color: white; border-radius: 50%; font-size: 35px;
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn:active { 
            background: #e74c3c; border-color: #fff; 
            transform: scale(0.9) translateY(2px); 
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="550"></canvas>
    </div>

    <div id="hud-bottom">
        <div class="stat-box">
            <div class="stat-label">PUNTOS</div>
            <div id="val-score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">VELOCIDAD</div>
            <div id="val-speed" class="stat-value">80 KM/H</div>
        </div>
    </div>

    <div id="controls">
        <div id="btn-left" class="btn">◀</div>
        <div id="btn-right" class="btn">▶</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('val-score');
        const speedEl = document.getElementById('val-speed');

        // --- CONFIGURACIÓN DE SONIDO ---
        // Sustituye el link por tu archivo .mp3 o .wav
        const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'); 
        bgMusic.loop = true;
        bgMusic.volume = 0.5;

        // Configuración Física
        const carW = 46; const carH = 88;
        let carX = canvas.width / 2 - carW / 2;
        let carY = canvas.height - 120;
        let carVelX = 0;
        
        let traffic = [];
        let score = 0;
        let speedKmh = 80;
        let isGameOver = false;
        let gameStarted = false; // Nueva bandera para el primer clic
        let keys = {};
        let worldOffset = 0;
        const lanes = [65, 175, 285];

        // Manejo de Controles
        const handleInput = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; checkMusic(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('mousedown', () => { keys[key] = true; checkMusic(); });
            el.addEventListener('mouseup', () => keys[key] = false);
        };
        handleInput('btn-left', 'ArrowLeft');
        handleInput('btn-right', 'ArrowRight');
        document.addEventListener('keydown', e => { keys[e.key] = true; checkMusic(); });
        document.addEventListener('keyup', e => keys[e.key] = false);

        // Función para asegurar que la música suene tras la primera interacción
        function checkMusic() {
            if (!isGameOver && bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Esperando interacción..."));
            }
        }

        function spawnTraffic() {
            if (Math.random() < 0.04) {
                const laneX = lanes[Math.floor(Math.random() * lanes.length)];
                const carsInLane = traffic.filter(t => t.x === laneX).length;

                if (carsInLane < 2) {
                    let canSpawn = true;
                    traffic.forEach(t => { if (t.x === laneX && t.y < 280) canSpawn = false; });

                    if (canSpawn) {
                        traffic.push({
                            x: laneX,
                            y: -150,
                            color: `hsl(${Math.random() * 360}, 50%, 45%)`,
                            speed: 0.5 + Math.random() * 1.5
                        });
                    }
                }
            }
        }

        function drawDetailedCar(x, y, color, isPlayer) {
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.roundRect(x + 4, y + 4, carW, carH, 12); ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#111';
            const wheelW = 6; const wheelH = 18;
            ctx.fillRect(x - 2, y + 12, wheelW, wheelH);
            ctx.fillRect(x + carW - 4, y + 12, wheelW, wheelH);
            ctx.fillRect(x - 2, y + 58, wheelW, wheelH);
            ctx.fillRect(x + carW - 4, y + 58, wheelW, wheelH);

            ctx.fillStyle = color;
            ctx.beginPath(); ctx.roundRect(x, y, carW, carH, 12); ctx.fill();
            
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x + 6, y + 20, carW - 12, 28);
            ctx.fillRect(x + 6, y + 60, carW - 12, 12);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x + 10, y + 25); ctx.lineTo(x + carW - 10, y + 45); ctx.stroke();

            if (isPlayer) {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(x + 5, y + carH - 4, 12, 3);
                ctx.fillRect(x + carW - 17, y + carH - 4, 12, 3);
            } else {
                ctx.fillStyle = '#fff';
                ctx.fillRect(x + 5, y + carH - 4, 10, 3);
                ctx.fillRect(x + carW - 15, y + carH - 4, 10, 3);
            }
            ctx.restore();
        }

        function update() {
            if (isGameOver) return;
            speedKmh += 0.04;
            let moveStep = speedKmh / 16;
            worldOffset += moveStep;

            if (keys['ArrowLeft']) carVelX -= 0.8;
            if (keys['ArrowRight']) carVelX += 0.8;
            carVelX *= 0.86;
            carX += carVelX;

            if (carX < 45) { carX = 45; carVelX = 0; }
            if (carX > canvas.width - carW - 45) { carX = canvas.width - carW - 45; carVelX = 0; }

            spawnTraffic();
            for (let i = traffic.length - 1; i >= 0; i--) {
                let t = traffic[i];
                t.y += moveStep - t.speed;
                if (t.y + carH - 12 > carY && t.x < carX + carW - 8 && t.x + carW > carX + 8 && t.y < carY + carH - 12) {
                    isGameOver = true;
                    // --- PARAR SONIDO AL CHOCAR ---
                    bgMusic.pause();
                    bgMusic.currentTime = 0; // Reiniciar al principio
                }
                if (t.y > canvas.height) { score++; traffic.splice(i, 1); }
            }
            scoreEl.innerText = score;
            speedEl.innerText = Math.floor(speedKmh) + " KM/H";
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#142a0f';
            ctx.fillRect(0, 0, 45, canvas.height);
            ctx.fillRect(canvas.width - 45, 0, 45, canvas.height);

            ctx.fillStyle = '#222';
            ctx.fillRect(45, 0, canvas.width - 90, canvas.height);

            ctx.strokeStyle = '#444';
            ctx.setLineDash([40, 40]);
            ctx.lineDashOffset = -worldOffset;
            [133, 266].forEach(lx => {
                ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, canvas.height); ctx.stroke();
            });

            traffic.forEach(t => drawDetailedCar(t.x, t.y, t.color, false));
            drawDetailedCar(carX, carY, '#0066ff', true);

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 30px Arial';
                ctx.fillText("TAS MATAO", canvas.width / 2, canvas.height / 2);
                ctx.font = '18px Arial'; ctx.fillText("Toca para reintentar", canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        // --- REINICIAR Y VOLVER A PONER SONIDO ---
        canvas.addEventListener('click', () => { 
            if (isGameOver) { 
                carX = canvas.width / 2 - carW / 2; 
                traffic = []; 
                score = 0; 
                speedKmh = 80; 
                isGameOver = false; 
                // Reiniciar sonido
                bgMusic.play();
            } else if (!gameStarted) {
                // Para el inicio del juego
                bgMusic.play();
                gameStarted = true;
            }
        });

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
