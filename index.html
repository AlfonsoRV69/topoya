<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topoya Birthday</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* Cielo */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #FFD700 100%);
            z-index: 1;
        }

        /* Imagen personalizada (Bandera o lo que sea) */
        .custom-image {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 200px;
            height: 120px;
            z-index: 1;
            animation: imageWave 2s ease-in-out infinite;
            transform-origin: left center;
            object-fit: contain;
        }

        @keyframes imageWave {
            0%, 100% {
                transform: skewY(0deg);
            }
            50% {
                transform: skewY(2deg);
            }
        }

        /* Estrella de David */
        .star-of-david {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 100px;
            height: 100px;
            z-index: 1;
            animation: starFloat 3s ease-in-out infinite;
        }

        @keyframes starFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Montañas al fondo */
        .mountains {
            position: absolute;
            bottom: 50%;
            left: 0;
            width: 100%;
            height: 35%;
            z-index: 2;
        }

        .mountain-back {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent 0%, #4a7c59 100%);
            clip-path: polygon(0% 100%, 15% 40%, 35% 20%, 50% 35%, 70% 15%, 85% 40%, 100% 25%, 100% 100%);
            z-index: 2;
        }

        .mountain-middle {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, transparent 0%, #2d5a3d 100%);
            clip-path: polygon(0% 100%, 20% 30%, 40% 10%, 60% 25%, 80% 15%, 100% 35%, 100% 100%);
            z-index: 3;
        }

        /* Torres en el fondo */
        .towers-container {
            position: absolute;
            bottom: 50%;
            left: 15%;
            width: 300px;
            height: 350px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 50px;
        }

        .tower {
            width: 80px;
            height: 280px;
            background: linear-gradient(90deg, #505050 0%, #707070 50%, #505050 100%);
            border: 2px solid #333;
            position: relative;
            box-shadow: inset -5px 0 10px rgba(0, 0, 0, 0.5), 5px 10px 15px rgba(0, 0, 0, 0.3);
        }

        .tower-window {
            width: 5px;
            height: 5px;
            background: #FFD700;
            position: absolute;
            margin: 10px;
        }

        .tower1 .tower-window {
            display: inline-block;
        }

        .tower2 .tower-window {
            display: inline-block;
        }

        /* Antena en la torre 1 */
        .antenna {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 70px;
            background: linear-gradient(90deg, #888, #aaa, #888);
            border-radius: 4px;
        }

        .antenna::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 12px solid #aaa;
        }

        /* Carretera */
        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, #444 0%, #222 50%, #111 100%);
            z-index: 4;
        }

        /* Línea central de la carretera */
        .road-line {
            position: absolute;
            bottom: 45%;
            left: 0;
            width: 100%;
            height: 3px;
            background: repeating-linear-gradient(
                90deg,
                #FFD700 0px,
                #FFD700 50px,
                transparent 50px,
                transparent 100px
            );
            z-index: 4;
            animation: roadMove 2s linear infinite;
        }

        @keyframes roadMove {
            0% {
                background-position: 0;
            }
            100% {
                background-position: 100px;
            }
        }

        /* Supra animado */
        .supra-container {
            position: absolute;
            left: -400px;
            top: 50%;
            animation: driveSupra 8s ease-in-out infinite;
            z-index: 5;
            filter: drop-shadow(10px 10px 20px rgba(0, 0, 0, 0.4));
            transform: scaleX(-1);
        }

        @keyframes driveSupra {
            0% {
                left: -400px;
            }
            50% {
                left: calc(50vw - 150px);
            }
            100% {
                left: 100vw;
            }
        }

        .supra-image {
            width: 400px;
            height: auto;
            object-fit: contain;
        }

        /* Explosión */
        .explosion {
            position: absolute;
            z-index: 6;
            pointer-events: none;
        }

        .explosion-particle {
            position: absolute;
            border-radius: 50%;
        }

        .flame {
            position: absolute;
            border-radius: 50%;
            filter: blur(3px);
            animation: flameAnimation 0.6s ease-out forwards;
        }

        @keyframes flameAnimation {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .explosion-light {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #FFD700, #FF4500);
            animation: explosionLightAnim 0.5s ease-out forwards;
        }

        @keyframes explosionLightAnim {
            0% {
                width: 150px;
                height: 150px;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* Nubes */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 100px;
            z-index: 6;
            animation: float 20s infinite linear;
        }

        .cloud1 {
            width: 80px;
            height: 30px;
            top: 15%;
            left: -80px;
            animation-duration: 25s;
        }

        .cloud2 {
            width: 100px;
            height: 35px;
            top: 25%;
            left: -100px;
            animation-duration: 30s;
        }

        .cloud3 {
            width: 70px;
            height: 28px;
            top: 20%;
            left: -70px;
            animation-duration: 35s;
        }

        @keyframes float {
            0% {
                left: -100px;
            }
            100% {
                left: 100vw;
            }
        }

        /* Título */
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .subtitle {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* Efecto de movimiento de la carretera */
        .road::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            top: 48%;
            background: repeating-linear-gradient(
                90deg,
                #FFD700 0px,
                #FFD700 40px,
                transparent 40px,
                transparent 80px
            );
            animation: roadMove 1.5s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cielo -->
        <div class="sky">
            <!-- Imagen personalizada que puedes cambiar -->
            <img id="uss" class="custom-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/US_flag_49_stars.svg/250px-US_flag_49_stars.svg.png" alt="Imagen personalizada">
            
            <!-- Estrella de David -->
            <svg class="star-of-david" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Triángulo superior -->
                <polygon points="50,10 90,80 10,80" fill="none" stroke="#4169E1" stroke-width="3"/>
                <!-- Triángulo inferior (invertido) -->
                <polygon points="10,20 90,20 50,90" fill="none" stroke="#4169E1" stroke-width="3"/>
            </svg>
        </div>

        <!-- Montañas -->
        <div class="mountains">
            <div class="mountain-back"></div>
            <div class="mountain-middle"></div>
        </div>

        <!-- Torres en el fondo -->
        <div class="towers-container">
            <!-- Torre 1 con antena -->
            <div class="tower" style="position: relative;">
                <div class="antenna"></div>
                <div class="tower-window" style="top: 15px; left: 10px;"></div>
                <div class="tower-window" style="top: 15px; left: 35px;"></div>
                <div class="tower-window" style="top: 35px; left: 10px;"></div>
                <div class="tower-window" style="top: 35px; left: 35px;"></div>
                <div class="tower-window" style="top: 55px; left: 10px;"></div>
                <div class="tower-window" style="top: 55px; left: 35px;"></div>
                <div class="tower-window" style="top: 75px; left: 10px;"></div>
                <div class="tower-window" style="top: 75px; left: 35px;"></div>
                <div class="tower-window" style="top: 95px; left: 10px;"></div>
                <div class="tower-window" style="top: 95px; left: 35px;"></div>
                <div class="tower-window" style="top: 115px; left: 10px;"></div>
                <div class="tower-window" style="top: 115px; left: 35px;"></div>
                <div class="tower-window" style="top: 135px; left: 10px;"></div>
                <div class="tower-window" style="top: 135px; left: 35px;"></div>
                <div class="tower-window" style="top: 155px; left: 10px;"></div>
                <div class="tower-window" style="top: 155px; left: 35px;"></div>
                <div class="tower-window" style="top: 175px; left: 10px;"></div>
                <div class="tower-window" style="top: 175px; left: 35px;"></div>
                <div class="tower-window" style="top: 195px; left: 10px;"></div>
                <div class="tower-window" style="top: 195px; left: 35px;"></div>
                <div class="tower-window" style="top: 215px; left: 10px;"></div>
                <div class="tower-window" style="top: 215px; left: 35px;"></div>
                <div class="tower-window" style="top: 235px; left: 10px;"></div>
                <div class="tower-window" style="top: 235px; left: 35px;"></div>
                <div class="tower-window" style="top: 255px; left: 10px;"></div>
                <div class="tower-window" style="top: 255px; left: 35px;"></div>
            </div>

            <!-- Torre 2 sin antena -->
            <div class="tower">
                <div class="tower-window" style="top: 15px; left: 10px;"></div>
                <div class="tower-window" style="top: 15px; left: 35px;"></div>
                <div class="tower-window" style="top: 35px; left: 10px;"></div>
                <div class="tower-window" style="top: 35px; left: 35px;"></div>
                <div class="tower-window" style="top: 55px; left: 10px;"></div>
                <div class="tower-window" style="top: 55px; left: 35px;"></div>
                <div class="tower-window" style="top: 75px; left: 10px;"></div>
                <div class="tower-window" style="top: 75px; left: 35px;"></div>
                <div class="tower-window" style="top: 95px; left: 10px;"></div>
                <div class="tower-window" style="top: 95px; left: 35px;"></div>
                <div class="tower-window" style="top: 115px; left: 10px;"></div>
                <div class="tower-window" style="top: 115px; left: 35px;"></div>
                <div class="tower-window" style="top: 135px; left: 10px;"></div>
                <div class="tower-window" style="top: 135px; left: 35px;"></div>
                <div class="tower-window" style="top: 155px; left: 10px;"></div>
                <div class="tower-window" style="top: 155px; left: 35px;"></div>
                <div class="tower-window" style="top: 175px; left: 10px;"></div>
                <div class="tower-window" style="top: 175px; left: 35px;"></div>
                <div class="tower-window" style="top: 195px; left: 10px;"></div>
                <div class="tower-window" style="top: 195px; left: 35px;"></div>
                <div class="tower-window" style="top: 215px; left: 10px;"></div>
                <div class="tower-window" style="top: 215px; left: 35px;"></div>
                <div class="tower-window" style="top: 235px; left: 10px;"></div>
                <div class="tower-window" style="top: 235px; left: 35px;"></div>
                <div class="tower-window" style="top: 255px; left: 10px;"></div>
                <div class="tower-window" style="top: 255px; left: 35px;"></div>
            </div>
        </div>

        <!-- Nubes (después de las torres para que pasen sobre ellas) -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <!-- Carretera -->
        <div class="road">
            <div class="road-line"></div>
        </div>

        <!-- Supra animado -->
        <div class="supra-container" id="supraCar">
            <img src="https://tmna.aemassets.toyota.com/is/image/toyota/toyota/jellies/max/2026/grsupra/3-0/2372/d13/1.png?fmt=png-alpha&wid=930&hei=328&qlt=90" alt="Toyota Supra" class="supra-image" id="image">
        </div>

        <!-- Contenedor de explosión -->
        <div id="explosionContainer"></div>

        <!-- Texto -->
        <div class="title">Happy Birthday Topoya</div>
        <div class="subtitle">Viva Vox</div>
    </div>

    <script>
        const supraCar = document.getElementById('supraCar');
        const explosionContainer = document.getElementById('explosionContainer');
        let explosionTriggered = false;

        // Monitorear la posición del Supra
        function checkExplosion() {
            const rect = supraCar.getBoundingClientRect();
            
            // Cuando el Supra está cerca del final (lado derecho)
            if (rect.left > window.innerWidth - 100 && !explosionTriggered) {
                explosionTriggered = true;
                
                // 50% de probabilidad de explosión
                if (Math.random() > 0.25) {
                    createExplosion(rect.left, rect.top);
                    supraCar.style.opacity = '0';
                }
                
                // Reiniciar para la siguiente vuelta
                setTimeout(() => {
                    explosionTriggered = false;
                    supraCar.style.opacity = '1';
                    explosionContainer.innerHTML = '';
                }, 1000);
            }
        }

        function createExplosion(x, y) {
            // Luz central de la explosión
            const light = document.createElement('div');
            light.className = 'explosion-light';
            light.style.left = x + 'px';
            light.style.top = y + 'px';
            light.style.transform = 'translate(-50%, -50%)';
            explosionContainer.appendChild(light);

            // Crear partículas de fuego
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'flame';
                
                const size = Math.random() * 40 + 20;
                const angle = (Math.PI * 2 * i) / 20 + (Math.random() - 0.5);
                const velocity = Math.random() * 150 + 100;
                
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 50;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = Math.random() > 0.5 ? '#FF6347' : '#FFD700';
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.transform = 'translate(-50%, -50%)';
                
                explosionContainer.appendChild(particle);
            }
        }

        // Revisar la posición cada frame
        setInterval(checkExplosion, 50);

        // Cargar la imagen del Supra
        const img = new Image();
        img.onload = function() {
            document.getElementById('image').src = img.src;
        };
        img.src = 'https://raw.githubusercontent.com/AlfonsoRV69/topoya/refs/heads/main/abascar.png';
    </script>
</body>
</html>
