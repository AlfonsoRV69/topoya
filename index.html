<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Supra - Carretera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* Cielo */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #FFD700 100%);
            z-index: 1;
        }

        /* Sol */
        .sun {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #FFFF99, #FFD700);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
            z-index: 1;
        }

        /* Montañas al fondo */
        .mountains {
            position: absolute;
            bottom: 50%;
            left: 0;
            width: 100%;
            height: 35%;
            z-index: 2;
        }

        .mountain-back {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent 0%, #4a7c59 100%);
            clip-path: polygon(0% 100%, 15% 40%, 35% 20%, 50% 35%, 70% 15%, 85% 40%, 100% 25%, 100% 100%);
            z-index: 2;
        }

        .mountain-middle {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, transparent 0%, #2d5a3d 100%);
            clip-path: polygon(0% 100%, 20% 30%, 40% 10%, 60% 25%, 80% 15%, 100% 35%, 100% 100%);
            z-index: 3;
        }

        /* Carretera */
        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, #444 0%, #222 50%, #111 100%);
            z-index: 4;
        }

        /* Línea central de la carretera */
        .road-line {
            position: absolute;
            bottom: 45%;
            left: 0;
            width: 100%;
            height: 3px;
            background: repeating-linear-gradient(
                90deg,
                #FFD700 0px,
                #FFD700 50px,
                transparent 50px,
                transparent 100px
            );
            z-index: 4;
            animation: roadMove 2s linear infinite;
        }

        @keyframes roadMove {
            0% {
                background-position: 0;
            }
            100% {
                background-position: 100px;
            }
        }

        /* Supra animado */
        .supra-container {
            position: absolute;
            left: -400px;
            top: 35%;
            animation: driveSupra 8s ease-in-out infinite;
            z-index: 5;
            filter: drop-shadow(10px 10px 20px rgba(0, 0, 0, 0.4));
        }

        @keyframes driveSupra {
            0% {
                left: -400px;
            }
            50% {
                left: calc(50vw - 150px);
            }
            100% {
                left: 100vw;
            }
        }

        .supra-image {
            width: 300px;
            height: auto;
            object-fit: contain;
        }

        /* Nubes */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 100px;
            z-index: 2;
            animation: float 20s infinite linear;
        }

        .cloud1 {
            width: 80px;
            height: 30px;
            top: 15%;
            left: -80px;
            animation-duration: 25s;
        }

        .cloud2 {
            width: 100px;
            height: 35px;
            top: 25%;
            left: -100px;
            animation-duration: 30s;
        }

        .cloud3 {
            width: 70px;
            height: 28px;
            top: 20%;
            left: -70px;
            animation-duration: 35s;
        }

        @keyframes float {
            0% {
                left: -100px;
            }
            100% {
                left: 100vw;
            }
        }

        /* Título */
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .subtitle {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* Efecto de movimiento de la carretera */
        .road::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            top: 48%;
            background: repeating-linear-gradient(
                90deg,
                #FFD700 0px,
                #FFD700 40px,
                transparent 40px,
                transparent 80px
            );
            animation: roadMove 1.5s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cielo -->
        <div class="sky">
            <div class="sun"></div>
        </div>

        <!-- Nubes -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <!-- Montañas -->
        <div class="mountains">
            <div class="mountain-back"></div>
            <div class="mountain-middle"></div>
        </div>

        <!-- Carretera -->
        <div class="road">
            <div class="road-line"></div>
        </div>

        <!-- Supra animado -->
        <div class="supra-container">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" alt="Toyota Supra" class="supra-image" id="supraCar">
        </div>

        <!-- Texto -->
        <div class="title">🏎️ Toyota Supra</div>
        <div class="subtitle">Acelerando por la carretera ⚡</div>
    </div>

    <script>
        // Cargar la imagen del Supra
        const img = new Image();
        img.onload = function() {
            document.getElementById('supraCar').src = img.src;
        };
        // Si tienes la imagen en una URL, cámbiala aquí
        img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
    </script>
</body>
</html>
